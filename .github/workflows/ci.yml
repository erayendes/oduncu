name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # One job per platform is the whole matrix: the installer is 97 lines of
    # path handling, and paths are the only thing that differs by OS.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - run: node bin/oduncu.js where
      - run: node bin/oduncu.js install --dry-run --all
      - name: Install into a sandbox home, verify, uninstall
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/sandbox-home"
          export USERPROFILE="$HOME"
          mkdir -p "$HOME"
          node bin/oduncu.js install --only claude,codex
          test -f "$HOME/.claude/skills/oduncu/SKILL.md"
          test -f "$HOME/.codex/skills/oduncu/SKILL.md"
          node bin/oduncu.js uninstall
          test ! -e "$HOME/.claude/skills/oduncu"
          test ! -e "$HOME/.codex/skills/oduncu"
      - name: SKILL.md frontmatter is intact
        shell: bash
        run: |
          head -1 skills/oduncu/SKILL.md | grep -qx -- '---'
          grep -q '^name: oduncu' skills/oduncu/SKILL.md
